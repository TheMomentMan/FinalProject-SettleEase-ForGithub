services:
  settleease:
    build:
      context: .               # your repo root
      dockerfile: Dockerfile  # or wherever your Dockerfile lives
    image: settleease:dev
    container_name: settleease_app
    command: npm run dev      # or your start script
    volumes:
      - ./:/workspace
      - /workspace/node_modules
    ports:
      - "3000:3000"           # adjust to your app’s port
    env_file:
      - .env
    environment:
      # only overrides or non-secret vars here
      - MYSQL_HOST=db
    depends_on:
      - db

  db:
    image: mysql:8.0
    platform: linux/arm64/v8
    container_name: settleease_db
    restart: always
    env_file:
      - .env
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  phpmyadmin:
    image: arm64v8/phpmyadmin:latest
    container_name: settleease_phpmyadmin
    depends_on:
      - db
    environment:
      - PMA_HOST=db
      - PMA_PORT=3306
      - PMA_ARBITRARY=1
    restart: always
    ports:
      - "8080:80"

volumes:
  mysql_data:
