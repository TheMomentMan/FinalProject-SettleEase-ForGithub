version: '3.8'

services:
  settleease:
    build:
      context: .               # your repo root
      dockerfile: Dockerfile  # or wherever your Dockerfile lives
    image: settleease:dev
    container_name: settleease_app
    command: npm run dev      # or your start script
    volumes:
      - ./:/workspace
      - /workspace/node_modules
    ports:
      - "3000:3000"           # adjust to your app’s port
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    depends_on:
      - db

  db:
    image: mysql:8.0
    platform: linux/arm64/v8
    container_name: settleease_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  phpmyadmin:
    image: arm64v8/phpmyadmin:latest
    container_name: settleease_phpmyadmin
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
    restart: always
    ports:
      - "8080:80"

volumes:
  mysql_data:
